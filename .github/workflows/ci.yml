name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            jit: true
          - os: macos-15-intel
            jit: true
          - os: macos-15
            jit: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build nero
        run: c++ -std=c++20 -O2 -Wall -Wextra -o nero src/main.cpp

      - name: Check generated workflow
        run: |
          ./nero eval .github/workflows/ci.nero > /tmp/ci.yml
          diff -u .github/workflows/ci.yml /tmp/ci.yml

      - name: Build and run test suites
        env:
          NERO_HAS_JIT: ${{ matrix.jit }}
        run: |
          for t in lexer parser codegen eval schema flow yaml import check diff; do
              if [ "$t" = codegen ] && [ "$NERO_HAS_JIT" != true ]; then
                  echo "Skipping codegen tests: this runner is not x86-64"
                  continue
              fi
              c++ -std=c++20 -O2 -Wall -Wextra -o /tmp/ci-test "tests/${t}_test.cpp"
              /tmp/ci-test
          done

      - name: Run documentation examples
        run: python3 tests/docs_test.py
