name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kubernetes-server-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build nero
        run: c++ -std=c++20 -O2 -Wall -Wextra -o nero src/main.cpp

      - name: Install Kubernetes schema validator
        run: python3 -m pip install --disable-pip-version-check kubernetes-validate==1.37.0

      - name: Install kubectl and kind
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-tools"
          curl -fsSLo "$RUNNER_TEMP/k8s-tools/kubectl" https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          curl -fsSLo "$RUNNER_TEMP/k8s-tools/kubectl.sha256" https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/k8s-tools/kubectl.sha256")  $RUNNER_TEMP/k8s-tools/kubectl" | sha256sum --check
          curl -fsSLo "$RUNNER_TEMP/k8s-tools/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/k8s-tools/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/k8s-tools/kubectl" "$RUNNER_TEMP/k8s-tools/kind"
          echo "$RUNNER_TEMP/k8s-tools" >> "$GITHUB_PATH"

      - name: Start Kubernetes cluster
        run: kind create cluster --name nero-ci --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 3m

      - name: Validate manifests with Kubernetes API server
        run: |
          ./nero check examples/k8s.nero
          ./nero policy examples/k8s.nero
          ./nero policy examples/k8s.nero --rules examples/policy_rules.nero
          ./nero eval examples/k8s.nero --yaml > /tmp/nero-manifests.yaml
          python3 tools/k8s_validate.py --version 1.37 /tmp/nero-manifests.yaml
          kubectl --context kind-nero-ci apply --dry-run=server --validate=strict -f /tmp/nero-manifests.yaml

      - name: Confirm Kubernetes rejects an invalid manifest
        run: |
          if kubectl --context kind-nero-ci apply --dry-run=server --validate=strict -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: invalid-replicas
          spec:
            replicas: "3"
            selector:
              matchLabels:
                app: invalid-replicas
            template:
              metadata:
                labels:
                  app: invalid-replicas
              spec:
                containers:
                  - name: app
                    image: example.invalid/app:1
          YAML
          then
              echo "Kubernetes accepted replicas as a string"
              exit 1
          fi

      - name: Build and load demo app image
        run: |
          docker build -t nero-demo-web:1.0.0 examples/k8s_app
          kind load docker-image nero-demo-web:1.0.0 --name nero-ci

      - name: Deploy demo and verify HTTP response
        run: |
          ./nero check examples/k8s.nero
          ./nero policy examples/k8s.nero
          ./nero eval examples/k8s.nero --yaml | kubectl --context kind-nero-ci apply --validate=strict -f -
          kubectl --context kind-nero-ci rollout status deployment/web-dev --timeout=120s
          kubectl --context kind-nero-ci port-forward service/web-dev 18080:80 > /tmp/nero-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
                  break
              fi
              sleep 1
          done
          response=$(curl --fail --silent http://127.0.0.1:18080/)
          printf '%s\n' "$response"
          RESPONSE="$response" python3 -c 'import json, os; data = json.loads(os.environ["RESPONSE"]); assert data["app"] == "nero-demo-web"; assert data["environment"] == "dev"; assert data["log_level"] == "debug"'

      - name: Delete Kubernetes cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
              kind delete cluster --name nero-ci
          fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            jit: true
          - os: macos-15-intel
            jit: true
          - os: macos-15
            jit: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build nero
        run: c++ -std=c++20 -O2 -Wall -Wextra -o nero src/main.cpp

      - name: Check generated workflows
        run: |
          ./nero eval .github/workflows/ci.nero > /tmp/ci.yml
          diff -u .github/workflows/ci.yml /tmp/ci.yml
          ./nero eval .github/workflows/release.nero > /tmp/release.yml
          diff -u .github/workflows/release.yml /tmp/release.yml

      - name: Build and run test suites
        env:
          NERO_HAS_JIT: ${{ matrix.jit }}
        run: |
          for t in lexer parser codegen eval schema flow yaml import check diff policy; do
              if [ "$t" = codegen ] && [ "$NERO_HAS_JIT" != true ]; then
                  echo "Skipping codegen tests: this runner is not x86-64"
                  continue
              fi
              c++ -std=c++20 -O2 -Wall -Wextra -o /tmp/ci-test "tests/${t}_test.cpp"
              /tmp/ci-test
          done

      - name: Install Kubernetes schema validator
        run: python3 -m pip install --disable-pip-version-check kubernetes-validate==1.37.0

      - name: Validate Kubernetes manifests
        run: python3 tests/kubernetes_schema_test.py

      - name: Run documentation examples
        run: python3 tests/docs_test.py
